<!DOCTYPE html>
<html lang="gu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>રજા રિપોર્ટ</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1e1b4b">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/2800/2800209.png">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background-color: #1e1b4b; }
    iframe { width: 100vw; height: 100vh; border: none; display: block; }
    #loading-box { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; color: #ffffff; font-family: sans-serif; font-size: 14px; }
  </style>
</head>
<body>

  <div id="loading-box">
    <div style="font-size: 16px; font-weight: bold; margin-bottom: 8px;">રજા રિપોર્ટ</div>
    <div style="color: #cbd5e1;">શાળા ડેટા લોડ થઈ રહ્યો છે...</div>
  </div>

  <iframe id="app-frame" style="display:none;" allow="clipboard-read; clipboard-write"></iframe>

  <script>
    // 🌟 અહીં તમારી Google Apps Script ની મૂળ /exec URL પેસ્ટ કરવી
    const SCRIPT_BASE_URL = "https://script.google.com/macros/s/AKfycbwgAkdZci5Zhx7fYwjrG4XpFLNzjZ2sua7ln5JruaMWPBj9Qmw8kVmNtvLRcYU_KrTXIA/exec";

    // URL માંથી શાળાનો કોડ મેળવવો
    const urlParams = new URLSearchParams(window.location.search);
    let school = urlParams.get('school');

    // જો સીધી એપ આઈકનથી ખોલે અને URL માં કોડ ન હોય, તો ફોનમાં સેવ કરેલો કોડ લેવો
    if (!school) {
      school = localStorage.getItem('SAVED_SCHOOL_CODE') || '24070607601';
    } else {
      localStorage.setItem('SAVED_SCHOOL_CODE', school);
    }

    const frame = document.getElementById('app-frame');
    const loading = document.getElementById('loading-box');

    frame.src = SCRIPT_BASE_URL + "?school=" + encodeURIComponent(school);

    frame.onload = function() {
      loading.style.display = 'none';
      frame.style.display = 'block';
    };

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js');
      });
    }
  </script>
</body>
</html>
